<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ K1M</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* Neon Glow */
    .neon {
      color: #c800ff;
      text-shadow: 0 0 5px #c800ff, 0 0 10px #c800ff, 0 0 20px #c800ff;
    }

    header {
      text-align: center;
      padding: 80px 20px;
      background: radial-gradient(circle at center, #111 0%, #000 80%);
    }

    header h1 {
      font-size: 4rem;
      letter-spacing: 4px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px;
      background: #070707;
      position: sticky;
      top: 0;
    }

    nav a {
      color: #c800ff;
      text-decoration: none;
      font-size: 1.1rem;
      text-shadow: 0 0 6px #c800ff;
    }

    section {
      padding: 80px 20px;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    .mixes iframe {
      width: 100%;
      height: 200px;
      margin-bottom: 20px;
      border: none;
      box-shadow: 0 0 10px #c800ff;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      color: #555;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="neon">DJ K1M</h1>
    

  <nav>
    <a href="#about">Bio</a>
    <a href="#mixes">Mixes</a>
    <a href="#contact">Booking</a>
  </nav>

  <section id="about">
    <h2 class="neon">Bio</h2>
    <p> HEY ! I AM DJ KIM, I AM PLAYING AMERICAN MUSIC AND MORE!!</p>

  </section>

  <section id="mixes" class="mixes">
    <h2 class="neon">Mixes</h2>
    <!-- Βάλε links των δικών σου -->
    <iframe src="https://youtu.be/ExS2sBMPrYI?si=rhXhHRa3tFFT39rl"></iframe>
    
  </section>

  <section id="contact">
    <h2 class="neon">Booking</h2>
    <p>Για κρατήσεις επικοινωνήστε:</p>
    <p class="neon">djkm0595@gmail.com</p>
  </section>

  <footer>
    © 2025 DJ K1M
  </footer>

</body>
</html>
